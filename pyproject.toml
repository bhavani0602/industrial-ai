[project]
name = "industrial-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "bhavani0602", email = "kothakapubhavani4@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "alembic>=1.19.1",
    "numpy>=2.2.6",
    "pandas>=2.3.3",
    "pgvector>=0.5.0",
    "psycopg2-binary>=2.9.12",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "scikit-learn>=1.7.2",
    "sqlalchemy>=2.0.52",
]

[project.scripts]
industrial-ai = "industrial_ai:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"
